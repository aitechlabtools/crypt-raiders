<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personajes y copia · maquetas</title>
<style>body{margin:0;background:#0d0b11;color:#e9e1cc;font-family:Georgia,serif;padding:24px}h1{font-size:22px}h2{color:#e8b33a;font-size:16px;margin:26px 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}figure{margin:0;background:#17141c;border:1px solid #3a3741;padding:8px}img{width:100%;display:block}figcaption{font-size:13px;color:#aaa;margin-top:6px}a{color:#e8b33a}code{color:#e8b33a}</style></head>
<body><h1>Crypt Raiders · Varios personajes, almacén por páginas y copia de seguridad (maquetas)</h1>
<p>Maqueta viva (con <code>npx vite --port 5173</code>): <a href="maqueta.html">maqueta.html</a> con <code>?v=menu | menu-nuevo | seleccion | borrar | cambiar | almacen | comprar | copia | importar</code>. Rehacer capturas: <code>node mockups/personajes-copia/capturar.cjs</code>.</p>
<div id="g"></div>
<script>
const S=[['Escritorio 1920×1080','escritorio'],['Tableta 1180×820','tableta'],['Móvil horizontal 844×390','movil']];
const V=[['menu','Menú principal'],['menu-nuevo','Primera vez (sin partida): «Tengo una copia»'],['seleccion','Elegir personaje'],['borrar','Borrar personaje (escribir el nombre)'],['cambiar','Cambiar de personaje desde el lobby'],['almacen','Almacén por páginas'],['comprar','Comprar una página'],['copia','Copia de seguridad'],['importar','Importar: qué contiene y confirmar']];
let h='';for(const[t,d]of S){h+=`<h2>${t}</h2><div class="g">`;for(const[f,c]of V){h+=`<figure><a href="capturas/${d}-${f}.png"><img loading="lazy" src="capturas/${d}-${f}.png"></a><figcaption>${c}</figcaption></figure>`}h+='</div>'}
document.getElementById('g').innerHTML=h;
</script></body></html>
